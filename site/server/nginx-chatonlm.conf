# chatonlm.com : site de présentation de ChatonLM.
#
# À copier sur le serveur dans /etc/nginx/sites-available/chatonlm.conf, puis à
# activer (lien dans sites-enabled, « nginx -t », rechargement). Ce fichier ne
# décrit que le port 80 ; « certbot --nginx --redirect --hsts » le complète
# ensuite pour HTTPS (y ajouter « http2 on; » sous chaque « listen 443 ssl; »).
# Il ne touche à aucun autre site du serveur.

# Langue de l'accueil d'après le navigateur : français, espagnol, sinon anglais.
map $http_accept_language $chatonlm_lang {
    default en;
    ~*^fr   fr;
    ~*^es   es;
}

# La réponse à « / » dépend de la langue du navigateur : les caches et les robots
# le savent par l'en-tête Vary (une valeur vide n'ajoute pas d'en-tête).
map $uri $chatonlm_vary {
    default "";
    "/"     "Accept-Language";
}

# Formulaire et téléchargements : 30 requêtes par minute et par adresse.
limit_req_zone $binary_remote_addr zone=chatonlm_api:1m rate=30r/m;

server {
    listen 80;
    # Si « nginx -t » se plaint de cette ligne (IPv6 coupé sur le serveur), la retirer.
    listen [::]:80;
    server_name chatonlm.com;

    root /var/www/chatonlm;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # Tout vient du site lui-même : aucun script, police ni image d'un tiers.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Ici et pas dans « location = / » : un add_header posé dans un location y
    # ferait perdre tous ceux du serveur.
    add_header Vary $chatonlm_vary always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    # Un robot sans langue annoncée reçoit l'anglais, la version par défaut des pages.
    location = / {
        return 302 /$chatonlm_lang/;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Page introuvable dans la langue du dossier demandé (l'anglais sert ailleurs).
    location ^~ /fr/ {
        error_page 404 /fr/404/index.html;
        try_files $uri $uri/ =404;
    }
    location ^~ /es/ {
        error_page 404 /es/404/index.html;
        try_files $uri $uri/ =404;
    }

    # Fichiers au nom unique (empreinte du contenu) : gardés un an par le navigateur.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    error_page 404 /404.html;

    # Service du site (site/server/service.mjs), qui n'écoute que sur cette machine.
    location ~ ^/(api|download)/ {
        limit_req zone=chatonlm_api burst=10 nodelay;
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

# Les autres adresses renvoient vers chatonlm.com.
server {
    listen 80;
    listen [::]:80;
    server_name www.chatonlm.com chatonlm.net www.chatonlm.net chatonlm.fr www.chatonlm.fr;
    return 301 https://chatonlm.com$request_uri;
}
