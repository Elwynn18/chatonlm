<div class="vue" data-vue="transcription">
  <p class="vue-outils"><span data-vers="etude">{{t:tools.study.name}}</span><span data-vers="correction">{{t:tools.proofread.name}}</span><span class="actif" data-vers="transcription">{{t:tools.transcription.name}}</span></p>
  <p class="vue-titre">{{t:demo.transcription.title}}</p>
  <!-- Le texte transcrit, horodaté, comme sur la page de l'app ; aucun site nommé. -->
  <p class="transcrit"><b>00:00</b><span>{{t:demo.transcription.line1}}</span></p>
  <p class="transcrit"><b>00:42</b><span>{{t:demo.transcription.line2}}</span></p>
  <p class="boutons-app"><b>{{t:demo.transcription.copy}}</b><b class="actif">{{t:demo.transcription.summarize}}</b></p>
</div>
