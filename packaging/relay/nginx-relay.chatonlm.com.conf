# relay.chatonlm.com : relais de ChatonLM (recherche web), service local sur
# 127.0.0.1:8790 (packaging/relay/chatonlm-relay.service).
#
# À copier sur le serveur dans /etc/nginx/sites-available/chatonlm-relay.conf,
# puis à activer (lien dans sites-enabled, « nginx -t », rechargement). Ce
# fichier ne décrit que le port 80 ; « certbot --nginx -d relay.chatonlm.com
# --redirect --hsts » le complète pour HTTPS (y ajouter « http2 on; » sous
# « listen 443 ssl; »). Il ne touche à aucun autre site du serveur : noms de
# zone et de journal propres au relais.

# Toutes requêtes : 5 par seconde et par adresse, en mémoire de nginx seulement.
limit_req_zone $binary_remote_addr zone=chatonlm_relay:10m rate=5r/s;

server {
    listen 80;
    # Si « nginx -t » se plaint de cette ligne (IPv6 coupé sur le serveur), la retirer.
    listen [::]:80;
    server_name relay.chatonlm.com;

    # Aucun journal d'accès : ni adresse IP ni chemin gardés. Erreurs graves seulement.
    access_log off;
    error_log /var/log/nginx/chatonlm-relay.error.log crit;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;

    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Refus de nginx (limit_req) en JSON, comme ceux du relais : l'app y lit
    # « rate_limited » (une page HTML serait une « réponse illisible »).
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"rate_limited"}}';
    }

    location / {
        return 404;
    }

    # API du relais (relay-proto) : rien d'autre n'est servi.
    location ~ ^/(health|v1/(challenge|register|search|status))$ {
        limit_req zone=chatonlm_relay burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Seule adresse lue par le relais (trust_proxy, connexion venue de
        # 127.0.0.1 seulement) ; rien venant du client.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
    }
}
