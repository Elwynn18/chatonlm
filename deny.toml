# Contrôle des licences des crates compilées dans ChatonLM :
# cargo deny --manifest-path src-tauri/Cargo.toml check licenses

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# La liste blanche vaut pour les dépendances à venir : pas d'avertissement pour
# une licence autorisée qui n'apparaît pas encore.
unused-allowed-license = "allow"

[licenses.private]
ignore = true
