[package]
name = "fake-services"
version = "0.1.0"
description = "Faux services (Hugging Face, sd-server, moteurs de recherche web) pour les essais de ChatonLM"
license = "MIT"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
futures-util = { version = "0.3.34", default-features = false }
# Faux moteur d'images : images PNG (déjà dans l'arbre par tauri).
png = "0.18.1"
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.2", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# Faux moteurs de recherche : formulaires et requêtes décodés.
url = "2.5.8"
