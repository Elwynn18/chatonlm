[package]
name = "fake-llama"
version = "0.1.0"
description = "Faux llama-server pour les essais de ChatonLM"
license = "MIT"
edition = "2024"
publish = false

[dependencies]
# Mêmes versions que fake-services (déjà dans l'arbre).
axum = "0.8.9"
futures-util = { version = "0.3.34", default-features = false }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
