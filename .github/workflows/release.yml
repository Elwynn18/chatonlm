# Release de ChatonLM en BROUILLON, pour Linux ET Windows : paquets signés
# pour les mises à jour (AppImage, .deb, installateur Windows), manifeste
# `latest.json`, sources LGPL, inventaire et rapports d'inspection. Une
# Release porte toujours les deux systèmes : l'app cherche sa plateforme dans
# `latest.json` à chaque vérification, et son absence serait une erreur.
# La CI ne publie jamais : l'utilisateur relit le brouillon puis le publie à
# la main sur GitHub, SANS cocher « Set as a pre-release » : l'app lit
# https://github.com/Elwynn18/chatonlm/releases/latest/download/latest.json,
# que GitHub ne sert que pour la dernière Release publiée non préliminaire.
#
# Lancement : en poussant un tag v<version> (égal à la version de
# src-tauri/tauri.conf.json), ou à la main (workflow_dispatch : tag
# v<version de tauri.conf.json>, créé à la publication sur le commit du run ;
# refusé si ce tag existe déjà sur un autre commit).
# Paquets construits SANS clé par packages.yml (Linux) et
# packages-windows.yml (Windows : essais Rust, installateur, inspection,
# installation et lancement de fumée), puis signés après coup dans le job
# `sign`, à part : la clé privée n'entre jamais dans la construction
# (vite, build.rs, cmake, scripts) ; seule l'étape « Signature » la reçoit et
# n'exécute que le CLI Tauri (version et empreintes de package-lock.json,
# installé sans scripts). Chaque signature est ensuite VÉRIFIÉE avec la clé
# publique de src-tauri/tauri.conf.json (scripts/release-manifest.mjs) : une
# autre clé (clé de test, clé régénérée) fait échouer la Release.
# Secrets (noms seulement, posés par l'utilisateur dans le dépôt) :
# TAURI_SIGNING_PRIVATE_KEY et TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
# « Released on » dans l'app : date du <release> de la version dans le
# metainfo (packaging/linux/…metainfo.xml), à poser au jour de la publication.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

# Jamais deux constructions de la même version à la fois ; une en cours
# n'est pas annulée.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Même version partout (tauri.conf.json, Cargo.toml, package.json et son
      # verrou, metainfo) ; un tag poussé doit la nommer.
      - name: Tag = version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          cargo="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)"
          npm="$(node -p 'require("./package.json").version')"
          lock="$(node -p 'require("./package-lock.json").version')"
          echo "tauri.conf.json $version, Cargo.toml $cargo, package.json $npm, package-lock.json $lock"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version invalide : $version" >&2
            exit 1
          fi
          if [ "$cargo" != "$version" ] || [ "$npm" != "$version" ] || [ "$lock" != "$version" ]; then
            echo "Versions différentes." >&2
            exit 1
          fi
          if ! grep -q "<release version=\"$version\"" packaging/linux/com.chatonlm.chatonlm.metainfo.xml; then
            echo "Pas de <release version=\"$version\"> dans le metainfo." >&2
            exit 1
          fi
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "Tag $REF_NAME, version v$version." >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
          } >>"$GITHUB_OUTPUT"

      # Lancement à la main : un tag v<version> déjà poussé doit désigner ce
      # commit (GitHub ignore --target pour un tag existant : la Release
      # aurait les sources du tag et les paquets d'un autre commit).
      - name: Tag existant = ce commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>"$RUNNER_TEMP/tag.err")"; then
            if grep -q "HTTP 404" "$RUNNER_TEMP/tag.err"; then
              echo "Tag $TAG absent : il sera créé à la publication, sur $GITHUB_SHA."
              exit 0
            fi
            cat "$RUNNER_TEMP/tag.err" >&2
            exit 1
          fi
          type="$(jq -r .object.type <<<"$ref")"
          sha="$(jq -r .object.sha <<<"$ref")"
          # Tag annoté : un objet « tag » qui désigne le commit.
          for _ in 1 2 3 4; do
            [ "$type" = tag ] || break
            object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha")"
            type="$(jq -r .object.type <<<"$object")"
            sha="$(jq -r .object.sha <<<"$object")"
          done
          if [ "$type" != commit ] || [ "$sha" != "$GITHUB_SHA" ]; then
            echo "Le tag $TAG désigne $type $sha, pas ce commit ($GITHUB_SHA) : supprimer le tag, ou lancer la Release depuis lui." >&2
            exit 1
          fi
          echo "Tag $TAG déjà sur ce commit."

  # Construction sans clé (packages.yml ne reçoit aucun secret).
  packages:
    name: Paquets
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/packages.yml

  # Installateur Windows, construit sans clé lui aussi (ni signature des
  # mises à jour, ni Authenticode : voir scripts/package-windows.sh).
  packages-windows:
    name: Installateur Windows
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/packages-windows.yml

  sign:
    name: Signatures des mises à jour
    needs: [version, packages, packages-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Code (CLI épinglé, vérification, metainfo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.nvmrc
            /package-lock.json
            /scripts/release-manifest.mjs
            /scripts/release-signer.mjs
            /src-tauri/tauri.conf.json
            /packaging/linux/

      - name: Node (.nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Seulement @tauri-apps/cli et son binaire, à la version et aux
      # empreintes de package-lock.json, sans aucun script d'installation.
      - name: CLI Tauri épinglé
        run: |
          node scripts/release-signer.mjs "$RUNNER_TEMP/signer"
          (cd "$RUNNER_TEMP/signer" && npm ci --ignore-scripts --no-audit --no-fund)
          "$RUNNER_TEMP/signer/node_modules/.bin/tauri" --version

      - name: Paquets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chatonlm-packages
          path: out

      # L'artefact Windows contient aussi des journaux (essais, fumée) : seul
      # l'installateur rejoint les paquets à signer.
      - name: Installateur Windows (artefact)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chatonlm-packages-windows
          path: windows

      - name: Installateur Windows
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: cp "windows/chatonlm_${VERSION}_x64-setup.exe" out/

      # Seule étape qui reçoit la clé ; la version est liée à chaque
      # signature (`requireSignedVersion` de l'app).
      - name: Signature
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Secret TAURI_SIGNING_PRIVATE_KEY absent." >&2
            exit 1
          fi
          mkdir signatures
          for name in "chatonlm_${VERSION}_amd64.AppImage" "chatonlm_${VERSION}_amd64.deb" \
            "chatonlm_${VERSION}_x64-setup.exe"; do
            "$RUNNER_TEMP/signer/node_modules/.bin/tauri" signer sign --app-version "$VERSION" "out/$name"
            mv "out/$name.sig" signatures/
          done

      # Chaque signature vérifiée sur son paquet avec la clé publique de
      # l'app : une autre clé fait échouer le job.
      - name: Vérification (clé publique de tauri.conf.json)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/release-manifest.mjs --version "$VERSION" --dir out \
            --signatures signatures --config src-tauri/tauri.conf.json \
            --metainfo packaging/linux/com.chatonlm.chatonlm.metainfo.xml \
            --out "$RUNNER_TEMP/latest.json"

      - name: Artefact des signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chatonlm-signatures
          path: signatures/
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Release en brouillon
    needs: [version, packages, packages-windows, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Code (manifeste, clé publique et metainfo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.nvmrc
            /scripts/release-manifest.mjs
            /src-tauri/tauri.conf.json
            /packaging/linux/

      - name: Node (.nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Paquets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chatonlm-packages
          path: out

      # Seuls l'installateur et son rapport d'inspection sont publiés (pas
      # les journaux des essais et de la fumée du même artefact).
      - name: Installateur Windows (artefact)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chatonlm-packages-windows
          path: windows

      - name: Installateur Windows
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cp "windows/chatonlm_${VERSION}_x64-setup.exe" out/
          cp windows/inspection-windows.txt out/

      - name: Signatures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chatonlm-signatures
          path: out

      # latest.json (signatures revérifiées avec la clé publique, version et
      # nom de fichier signés ; date du <release> du metainfo) et texte de la
      # Release, depuis la description de la version dans le metainfo.
      - name: Manifeste des mises à jour
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/release-manifest.mjs --version "$VERSION" --dir out \
            --config src-tauri/tauri.conf.json \
            --metainfo packaging/linux/com.chatonlm.chatonlm.metainfo.xml \
            --out out/latest.json --notes-out release-notes.md
          # Les deux systèmes, toujours : sans sa plateforme, une app déjà
          # installée afficherait une erreur à chaque vérification.
          for platform in linux-x86_64 linux-x86_64-appimage linux-x86_64-deb \
            windows-x86_64 windows-x86_64-nsis; do
            if ! jq -e --arg p "$platform" '.platforms[$p].signature and .platforms[$p].url' out/latest.json >/dev/null; then
              echo "latest.json : plateforme $platform absente." >&2
              exit 1
            fi
          done
          (cd out && sha256sum -- * >SHA256SUMS)
          ls -l out

      - name: Brouillon
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Une Release $TAG existe déjà (brouillon compris) : la supprimer d'abord." >&2
            exit 1
          fi
          # --draft : jamais publiée par la CI ; jamais --prerelease (voir
          # l'en-tête).
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" --title "ChatonLM $VERSION" \
            --notes-file release-notes.md out/*
